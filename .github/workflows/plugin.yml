name: Validate and package plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: neuraldeep-design-studio
          path: dist/*.zip
